[project]
name = "astrobill"
version = "2.0.0"
description = "Astro Bill — local 24/7 Kalshi 15-minute crypto scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astrobill = "astrobill.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrobill*"]
