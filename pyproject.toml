[project]
name = "astrobill"
version = "0.1.0"
description = "Astro Bill — local 24/7 Kalshi 15-minute crypto scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astrobill = "astrobill.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
